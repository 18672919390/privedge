[project]
name = "privedge"
version = "0.4.1"
requires-python = ">=3.12"
dependencies = ["numpy==2.3.5", "pandas==3.0.1", "cryptography==50.0.1", "fastapi==0.141.1", "uvicorn==0.54.0",
                "pydantic==2.13.5"]

[project.optional-dependencies]
dev = ["pytest", "httpx2==2.13.1", "websockets==17.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
