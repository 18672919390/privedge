<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="950" viewBox="0 0 1800 950"><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,SimHei,sans-serif"><text x="900" y="42" font-size="38" fill="#17202a" text-anchor="middle" dominant-baseline="middle">PrivEdge 多源 LDP 摘要可信交换架构</text><rect x="45" y="130" width="290" height="195" rx="14" fill="#eaf2f8" stroke="#617384" stroke-width="2"/><text x="190.0" y="165" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">用户端</text><text x="190.0" y="212" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">OLH本地扰动</text><text x="190.0" y="250" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">上报种子与桶</text><text x="190.0" y="288" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">本机模拟终端</text><rect x="400" y="130" width="310" height="195" rx="14" fill="#eaf2f8" stroke="#617384" stroke-width="2"/><text x="555.0" y="165" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">区域发布者</text><text x="555.0" y="212" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">过滤报告并估计</text><text x="555.0" y="250" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">构建Top-m摘要</text><text x="555.0" y="288" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">规范正文并签名</text><rect x="780" y="115" width="335" height="225" rx="14" fill="#eaf2f8" stroke="#617384" stroke-width="2"/><text x="947.5" y="150" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">账本与注册表</text><text x="947.5" y="197" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">主体、角色、公钥</text><text x="947.5" y="235" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">验签与预算检查</text><text x="947.5" y="273" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">追加哈希链</text><text x="947.5" y="311" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">窗口用户重叠不验证</text><rect x="1200" y="105" width="535" height="255" rx="14" fill="#eaf2f8" stroke="#617384" stroke-width="2"/><text x="1467.5" y="140" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">目标服务</text><text x="1467.5" y="187" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">预测前先校验账本链</text><text x="1467.5" y="225" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">验签、窗口、域、账本绑定</text><text x="1467.5" y="263" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">同源多摘要拒收</text><text x="1467.5" y="301" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">截尾、支持、封顶、融合</text><line x1="335" y1="228" x2="400" y2="228" stroke="#34495e" stroke-width="3"/><polygon points="400.00,228.00 385.59,234.96 385.59,221.04" fill="#34495e"/><line x1="710" y1="220" x2="780" y2="220" stroke="#34495e" stroke-width="3"/><polygon points="780.00,220.00 765.59,226.96 765.59,213.04" fill="#34495e"/><line x1="1115" y1="228" x2="1200" y2="228" stroke="#34495e" stroke-width="3"/><polygon points="1200.00,228.00 1185.59,234.96 1185.59,221.04" fill="#34495e"/><text x="365" y="185" font-size="21" fill="#17202a" text-anchor="middle" dominant-baseline="middle">扰动报告</text><text x="744" y="180" font-size="21" fill="#17202a" text-anchor="middle" dominant-baseline="middle">签名登记</text><text x="1155" y="185" font-size="21" fill="#17202a" text-anchor="middle" dominant-baseline="middle">准入</text><rect x="1190" y="435" width="555" height="150" rx="14" fill="#eaf2f8" stroke="#617384" stroke-width="2"/><text x="1467.5" y="470" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">决策与审计</text><text x="1467.5" y="517" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">检查通过、降级、拒答与原因码</text><text x="1467.5" y="555" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">输入摘要值、链头、审计记录</text><line x1="1460" y1="360" x2="1460" y2="435" stroke="#34495e" stroke-width="3"/><polygon points="1460.00,435.00 1453.04,420.59 1466.96,420.59" fill="#34495e"/><rect x="1230" y="715" width="510" height="155" rx="14" fill="#eaf2f8" stroke="#617384" stroke-width="2"/><text x="1485.0" y="750" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">Web控制台</text><text x="1485.0" y="797" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">REST与WebSocket事件和结果</text><text x="1485.0" y="835" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">检查通过不表示预测准确</text><line x1="1470" y1="585" x2="1470" y2="715" stroke="#34495e" stroke-width="3"/><polygon points="1470.00,715.00 1463.04,700.59 1476.96,700.59" fill="#34495e"/><rect x="65" y="660" width="300" height="155" rx="14" fill="#f3f4f6" stroke="#617384" stroke-width="2"/><text x="215.0" y="695" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">目标真实分布</text><text x="215.0" y="742" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">仅用于离线打分</text><text x="215.0" y="780" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">不进入准入与融合</text><rect x="495" y="660" width="470" height="155" rx="14" fill="#f3f4f6" stroke="#617384" stroke-width="2"/><text x="730.0" y="695" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">离线评估器</text><text x="730.0" y="742" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">接收预测结果与目标真值</text><text x="730.0" y="780" font-size="32" fill="#17202a" text-anchor="middle" dominant-baseline="middle">生成统计代理任务评价</text><line x1="365" y1="730" x2="495" y2="730" stroke="#34495e" stroke-width="3"/><polygon points="495.00,730.00 480.59,736.96 480.59,723.04" fill="#34495e"/><line x1="1190" y1="510" x2="1010" y2="510" stroke="#