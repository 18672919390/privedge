<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1150" viewBox="0 0 1800 1150"><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei,SimHei,sans-serif"><text x="900" y="40" font-size="38" fill="#17202a" text-anchor="middle" dominant-baseline="middle">签名摘要发布、准入与拒答流程</text><rect x="15" y="80" width="230" height="70" rx="14" fill="#eaf2f8" stroke="#617384" stroke-width="2"/><text x="130.0" y="115" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">用户端</text><line x1="130" y1="165" x2="130" y2="1060" stroke="#b8c2cc" stroke-dasharray="6 5"/><rect x="325" y="80" width="230" height="70" rx="14" fill="#eaf2f8" stroke="#617384" stroke-width="2"/><text x="440.0" y="115" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">发布者</text><line x1="440" y1="165" x2="440" y2="1060" stroke="#b8c2cc" stroke-dasharray="6 5"/><rect x="635" y="80" width="230" height="70" rx="14" fill="#eaf2f8" stroke="#617384" stroke-width="2"/><text x="750.0" y="115" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">密钥注册表</text><line x1="750" y1="165" x2="750" y2="1060" stroke="#b8c2cc" stroke-dasharray="6 5"/><rect x="945" y="80" width="230" height="70" rx="14" fill="#eaf2f8" stroke="#617384" stroke-width="2"/><text x="1060.0" y="115" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">账本服务</text><line x1="1060" y1="165" x2="1060" y2="1060" stroke="#b8c2cc" stroke-dasharray="6 5"/><rect x="1255" y="80" width="230" height="70" rx="14" fill="#eaf2f8" stroke="#617384" stroke-width="2"/><text x="1370.0" y="115" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">目标服务</text><line x1="1370" y1="165" x2="1370" y2="1060" stroke="#b8c2cc" stroke-dasharray="6 5"/><rect x="1535" y="80" width="230" height="70" rx="14" fill="#eaf2f8" stroke="#617384" stroke-width="2"/><text x="1650.0" y="115" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">审计记录</text><line x1="1650" y1="165" x2="1650" y2="1060" stroke="#b8c2cc" stroke-dasharray="6 5"/><line x1="130" y1="225" x2="440" y2="225" stroke="#34495e" stroke-width="3"/><polygon points="440.00,225.00 425.59,231.96 425.59,218.04" fill="#34495e"/><rect x="269.5" y="173" width="321" height="44" fill="white"/><text x="430" y="195" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">1 发送OLH扰动报告</text><line x1="440" y1="285" x2="495" y2="285" stroke="#34495e" stroke-width="3"/><polygon points="495.00,285.00 480.59,291.96 480.59,278.04" fill="#34495e"/><line x1="495" y1="285" x2="495" y2="304" stroke="#34495e" stroke-width="3"/><polygon points="495.00,304.00 488.04,289.59 501.96,289.59" fill="#34495e"/><line x1="495" y1="304" x2="440" y2="304" stroke="#34495e" stroke-width="3"/><polygon points="440.00,304.00 454.41,297.04 454.41,310.96" fill="#34495e"/><rect x="192.0" y="243" width="496" height="44" fill="white"/><text x="440" y="265" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">2 过滤与估计，构建Top-m摘要</text><line x1="440" y1="355" x2="495" y2="355" stroke="#34495e" stroke-width="3"/><polygon points="495.00,355.00 480.59,361.96 480.59,348.04" fill="#34495e"/><line x1="495" y1="355" x2="495" y2="374" stroke="#34495e" stroke-width="3"/><polygon points="495.00,374.00 488.04,359.59 501.96,359.59" fill="#34495e"/><line x1="495" y1="374" x2="440" y2="374" stroke="#34495e" stroke-width="3"/><polygon points="440.00,374.00 454.41,367.04 454.41,380.96" fill="#34495e"/><rect x="163.0" y="313" width="554" height="44" fill="white"/><text x="440" y="335" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">3 补时间与nonce，签名规范化正文</text><line x1="440" y1="435" x2="1060" y2="435" stroke="#34495e" stroke-width="3"/><polygon points="1060.00,435.00 1045.59,441.96 1045.59,428.04" fill="#34495e"/><rect x="591.0" y="383" width="318" height="44" fill="white"/><text x="750.0" y="405" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">4 提交签名摘要登记</text><line x1="1060" y1="505" x2="750" y2="505" stroke="#34495e" stroke-width="3"/><polygon points="750.00,505.00 764.41,498.04 764.41,511.96" fill="#34495e"/><rect x="661.0" y="453" width="488" height="44" fill="white"/><text x="905.0" y="475" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">5 核对主体、角色、公钥并验签</text><line x1="1060" y1="565" x2="1115" y2="565" stroke="#34495e" stroke-width="3"/><polygon points="1115.00,565.00 1100.59,571.96 1100.59,558.04" fill="#34495e"/><line x1="1115" y1="565" x2="1115" y2="584" stroke="#34495e" stroke-width="3"/><polygon points="1115.00,584.00 1108.04,569.59 1121.96,569.59" fill="#34495e"/><line x1="1115" y1="584" x2="1060" y2="584" stroke="#34495e" stroke-width="3"/><polygon points="1060.00,584.00 1074.41,577.04 1074.41,590.96" fill="#34495e"/><rect x="732.5" y="523" width="655" height="44" fill="white"/><text x="1060" y="545" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">6 查重复ID/nonce、ε与预算，追加链条目</text><line x1="440" y1="645" x2="1370" y2="645" stroke="#34495e" stroke-width="3"/><polygon points="1370.00,645.00 1355.59,651.96 1355.59,638.04" fill="#34495e"/><rect x="661.0" y="593" width="488" height="44" fill="white"/><text x="905.0" y="615" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">7 将已登记摘要提交给目标服务</text><line x1="1370" y1="715" x2="1060" y2="715" stroke="#34495e" stroke-width="3"/><polygon points="1060.00,715.00 1074.41,708.04 1074.41,721.96" fill="#34495e"/><rect x="920.0" y="663" width="590" height="44" fill="white"/><text x="1215.0" y="685" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">8 预测前校验整条链，异常则直接拒答</text><line x1="1370" y1="785" x2="750" y2="785" stroke="#34495e" stroke-width="3"/><polygon points="750.00,785.00 764.41,778.04 764.41,791.96" fill="#34495e"/><rect x="765.0" y="733" width="590" height="44" fill="white"/><text x="1060.0" y="755" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">9 网关再验签、角色、窗口、域与字段</text><line x1="1370" y1="855" x2="1060" y2="855" stroke="#34495e" stroke-width="3"/><polygon points="1060.00,855.00 1074.41,848.04 1074.41,861.96" fill="#34495e"/><rect x="961.0" y="803" width="508" height="44" fill="white"/><text x="1215.0" y="825" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">10 核对编号、摘要值与窗口预算</text><line x1="1370" y1="915" x2="1425" y2="915" stroke="#34495e" stroke-width="3"/><polygon points="1425.00,915.00 1410.59,921.96 1410.59,908.04" fill="#34495e"/><line x1="1425" y1="915" x2="1425" y2="934" stroke="#34495e" stroke-width="3"/><polygon points="1425.00,934.00 1418.04,919.59 1431.96,919.59" fill="#34495e"/><line x1="1425" y1="934" x2="1370" y2="934" stroke="#34495e" stroke-width="3"/><polygon points="1370.00,934.00 1384.41,927.04 1384.41,940.96" fill="#34495e"/><rect x="998.0" y="873" width="644" height="44" fill="white"/><text x="1320" y="895" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">11 去重复与同源多摘要；鲁棒融合及三态</text><line x1="1370" y1="995" x2="1650" y2="995" stroke="#34495e" stroke-width="3"/><polygon points="1650.00,995.00 1635.59,1001.96 1635.59,988.04" fill="#34495e"/><rect x="1032.0" y="943" width="576" height="44" fill="white"/><text x="1320" y="965" font-size="34" fill="#17202a" text-anchor="middle" dominant-baseline="middle">12 记录输入摘要、链头、准入与决策</text><text x="900" y="1095" font-size="25" fill="#17202a" text-anchor="middle" dominant-baseline="middle">单份拒收不自动等于整次拒答；审计记录在目标服务内生成，不是独立分布式审计系统</text></g></svg>